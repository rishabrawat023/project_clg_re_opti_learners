<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Resource - Campus Resource Optimizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">Campus Resource Optimizer</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('resources_page') }}">Resources</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('bookings_page') }}">Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('recommendation_page') }}">Recommendation</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    <h1 class="mb-4">Edit Resource</h1>
    <form method="post" action="{{ url_for('edit_resource_route', resource_id=resource.resource_id) }}">
        <div class="mb-3"><label class="form-label">Resource ID</label><input class="form-control" name="resource_id" value="{{ resource.resource_id }}" readonly></div>
        <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ resource.name }}" required></div>
        <div class="mb-3"><label class="form-label">Type</label>
            <select class="form-select" name="resource_type" required>
                <option {% if resource.resource_type == 'Classroom' %}selected{% endif %}>Classroom</option>
                <option {% if resource.resource_type == 'Computer Lab' %}selected{% endif %}>Computer Lab</option>
                <option {% if resource.resource_type == 'Seminar Hall' %}selected{% endif %}>Seminar Hall</option>
                <option {% if resource.resource_type == 'Auditorium' %}selected{% endif %}>Auditorium</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Capacity</label><input type="number" class="form-control" name="capacity" value="{{ resource.capacity }}" required></div>
        <div class="mb-3"><label class="form-label">Building</label><input class="form-control" name="building" value="{{ resource.building }}" required></div>
        <div class="mb-3"><label class="form-label">Floor</label><input type="number" class="form-control" name="floor" value="{{ resource.floor }}" required></div>
        <div class="mb-3"><label class="form-label">Equipment</label><input class="form-control" name="equipment" value="{{ resource.equipment }}"></div>
        <div class="mb-3"><label class="form-label">Status</label>
            <select class="form-select" name="status" required>
                <option {% if resource.status == 'Available' %}selected{% endif %}>Available</option>
                <option {% if resource.status == 'Unavailable' %}selected{% endif %}>Unavailable</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('resources_page') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
