<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recommendation - Campus Resource Optimizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">Campus Resource Optimizer</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('resources_page') }}">Resources</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('bookings_page') }}">Bookings</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="{{ url_for('recommendation_page') }}">Recommendation</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    <h1 class="mb-4">Resource Recommendation</h1>
    <form method="post" action="{{ url_for('recommendation_result') }}">
        <div class="mb-3"><label class="form-label">Number of Students</label><input type="number" class="form-control" name="students" required></div>
        <div class="mb-3"><label class="form-label">Resource Type</label>
            <select class="form-select" name="resource_type" required>
                <option value="Classroom">Classroom</option>
                <option value="Computer Lab">Computer Lab</option>
                <option value="Seminar Hall">Seminar Hall</option>
                <option value="Auditorium">Auditorium</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Required Equipment (comma separated)</label><input class="form-control" name="equipment" placeholder="e.g., Projector, AC"></div>
        <button type="submit" class="btn btn-primary">Find Recommendation</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
